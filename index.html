<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>挪威的森林 - 阅读器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <style>
        :root {
            /* 纸张质感配色 */
            --bg-color: #f5f4ee; 
            --page-bg: #fdfcf8;
            --text-color: #2c2b29;
            --font-family: 'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 顶部信息栏 */
        #top-bar {
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #888;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0,0,0,0.03);
            background: var(--bg-color);
            z-index: 101; /* 确保在最上方 */
        }

        #title-display {
            font-weight: bold;
            color: #555;
        }

        /* 阅读器主容器 */
        #viewer-container {
            flex: 1;
            display: flex;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 100%;
            overflow: auto; /* 允许连续滚动 */
        }

        #viewer {
            width: 100%;
            max-width: 860px;
            height: 100%;
            background-color: var(--page-bg);
            box-shadow: 0 0 30px rgba(0,0,0,0.02);
            position: relative;
        }

        /* 加载动画 */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #999;
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 99;
        }

        /* 错误提示框 */
        #error-msg {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--page-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #eee;
            color: #d32f2f;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <span id="title-display">正在加载...</span>
        <span id="progress-display"></span>
    </div>

    <div id="viewer-container">
        <div id="viewer"></div>
        <div id="loading">加载中...</div>
        
        <div id="error-msg">
            加载失败 🥲<br><br>
            <span style="color:#666; font-size:14px;">请检查 GitHub 仓库中是否有 <b>book.epub</b> 文件，<br>且与 reader.html 在同一级目录下。</span>
        </div>
    </div>

    <script>
        const targetFilename = "book.epub"; 
        let book = null;
        let rendition = null;

        const viewerContainer = document.getElementById('viewer-container');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('error-msg');
        const titleDisplay = document.getElementById('title-display');

        function initRendition(epubBook) {
            // 设置渲染器：改为 continuous 模式，启用垂直滚动
            rendition = epubBook.renderTo("viewer", {
                manager: "continuous",
                flow: "scrolled",
                width: "100%",
                height: "100%"
            });

            // 注入“自然阅读”的 CSS 样式
            rendition.themes.default({
                "body": {
                    "background": "transparent !important",
                    "font-family": "'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif !important",
                    "color": "#2c2b29 !important",
                    "line-height": "1.8 !important",
                    "padding": "20px 40px !important",
                    "text-align": "justify",
                    "font-size": "18px",
                    "max-width": "860px",
                    "margin": "0 auto"
                },
                "p": {
                    "text-indent": "2em",
                    "margin-bottom": "1em"
                },
                "h1, h2, h3": {
                    "font-family": "inherit",
                    "color": "#333 !important",
                    "text-align": "center"
                }
            });

            // 渲染完毕
            rendition.display().then(() => {
                loading.style.display = 'none';
                titleDisplay.innerText = "挪威的森林 - 村上春树";
            });

            // 简化翻页方案2：全屏点击前进
            // 在 scrolled 模式下，rendition.next() 将通过滚动来推进内容
            viewerContainer.addEventListener('click', (e) => {
                // 如果是电脑端，点击事件可能会在iframe内部触发，
                // ePub.js 默认会处理 scrolled 模式下的滚动。
                // 这里的点击事件主要是作为一个备用机制。
                rendition.next();
            });

            // 键盘左右键仍保留为前进/后退
            document.addEventListener('keyup', (e) => {
                if(e.key === "ArrowLeft") rendition.prev();
                if(e.key === "ArrowRight") rendition.next();
            });
        }

        // 直接从网络请求加载 book.epub
        book = ePub(targetFilename);
        
        book.ready.then(() => {
            initRendition(book);
        }).catch((err) => {
            console.error("电子书加载失败:", err);
            loading.style.display = 'none';
            errorMsg.style.display = 'block';
        });

    </script>
</body>
</html>
